<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统安装 - PHP笔记系统 V2.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh; color: #e0e0e0;
        }
        .container { max-width: 640px; margin: 0 auto; padding: 40px 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; color: #d4af37; margin-bottom: 8px; }
        .header p { color: #999; font-size: 14px; }
        .step { display: none; }
        .step.active { display: block; }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 24px; margin-bottom: 20px;
        }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #d4af37; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #bbb; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08); color: #fff; font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: #d4af37;
        }
        .btn {
            padding: 12px 28px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 15px; font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary { background: #d4af37; color: #1a1a2e; }
        .btn-primary:hover { background: #e0c050; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #e0e0e0; }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .actions { display: flex; gap: 12px; margin-top: 20px; }
        .check-list { list-style: none; }
        .check-list li {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .check-list .icon { font-size: 16px; width: 20px; text-align: center; }
        .check-list .pass { color: #4caf50; }
        .check-list .fail { color: #f44336; }
        .check-list .warn { color: #ff9800; }
        .check-list .hint { font-size: 12px; color: #666; margin-left: 30px; }
        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .msg-success { background: rgba(76,175,80,0.15); color: #4caf50; border: 1px solid rgba(76,175,80,0.3); }
        .msg-error { background: rgba(244,67,54,0.15); color: #f44336; border: 1px solid rgba(244,67,54,0.3); }
        .msg-info { background: rgba(33,150,243,0.15); color: #2196f3; border: 1px solid rgba(33,150,243,0.3); }
        .spin { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .captcha-box { display: flex; gap: 12px; align-items: center; }
        .captcha-box img { border-radius: 6px; cursor: pointer; height: 40px; }
        .captcha-box input { flex: 1; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>PHP笔记系统 V2.0</h1>
        <p>安装向导</p>
    </div>

    <!-- Step 1: Environment Check -->
    <div id="step1" class="step active">
        <div class="card">
            <h2>第一步：环境检测</h2>
            <div id="env-status"></div>
            <ul id="env-checks" class="check-list"></ul>
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="checkEnv()" id="btn-check-env">开始检测</button>
            <button class="btn btn-primary" onclick="goStep(2)" id="btn-next-1" style="display:none">下一步</button>
        </div>
    </div>

    <!-- Step 2: Database -->
    <div id="step2" class="step">
        <div class="card">
            <h2>第二步：数据库配置</h2>
            <div id="db-msg"></div>
            <div class="form-group">
                <label>主机地址</label>
                <input type="text" id="db_host" value="localhost">
            </div>
            <div class="form-group">
                <label>端口</label>
                <input type="text" id="db_port" value="3306">
            </div>
            <div class="form-group">
                <label>数据库名</label>
                <input type="text" id="db_name" value="note" placeholder="请先在MySQL中创建数据库">
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="db_user" value="root">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="db_pass" placeholder="数据库密码">
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-secondary" onclick="goStep(1)">上一步</button>
            <button class="btn btn-primary" onclick="testDB()" id="btn-test-db">测试连接</button>
            <button class="btn btn-primary" onclick="installDB()" id="btn-install-db" style="display:none">安装数据库</button>
            <button class="btn btn-primary" onclick="goStep(3)" id="btn-next-2" style="display:none">下一步</button>
        </div>
    </div>

    <!-- Step 3: Admin Account -->
    <div id="step3" class="step">
        <div class="card">
            <h2>第三步：创建管理员账户</h2>
            <div id="admin-msg"></div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="admin_username" placeholder="管理员用户名">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="admin_email" placeholder="管理员邮箱">
            </div>
            <div class="form-group">
                <label>显示名称</label>
                <input type="text" id="admin_fullname" placeholder="管理员显示名">
            </div>
            <div class="form-group">
                <label>密码（至少8位，含大小写字母、数字和特殊字符）</label>
                <input type="password" id="admin_password" placeholder="管理员密码">
            </div>
            <div class="form-group">
                <label>注册模式</label>
                <select id="registration_mode">
                    <option value="invite">邀请注册</option>
                    <option value="open">开放注册</option>
                    <option value="closed">关闭注册</option>
                </select>
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div class="captcha-box">
                    <input type="text" id="admin_captcha" placeholder="验证码" maxlength="4">
                    <img id="captcha-img" src="Captcha.php" alt="验证码" onclick="refreshCaptcha()">
                </div>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-secondary" onclick="goStep(2)">上一步</button>
            <button class="btn btn-primary" onclick="createAdmin()">完成安装</button>
        </div>
    </div>

    <!-- Step 4: Complete -->
    <div id="step4" class="step">
        <div class="card" style="text-align:center">
            <h2 style="font-size:48px;margin-bottom:12px">&#10003;</h2>
            <h2>安装完成!</h2>
            <p style="color:#999;margin:12px 0">系统已成功安装，请妥善保管管理员账户信息。</p>
            <div class="actions" style="justify-content:center">
                <a href="index.html" class="btn btn-primary" style="text-decoration:none">进入系统</a>
            </div>
        </div>
    </div>
</div>

<script>
const API = 'install.php?action=';

function msg(el, text, type) {
    const m = document.getElementById(el + '-msg');
    if (!text) { m.innerHTML = ''; return; }
    m.innerHTML = '<div class="msg msg-' + type + '">' + text + '</div>';
}

function goStep(n) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step' + n).classList.add('active');
}

async function api(action, data) {
    const opts = {
        method: data ? 'POST' : 'GET',
        headers: data ? { 'Content-Type': 'application/x-www-form-urlencoded' } : {}
    };
    if (data) {
        opts.body = Object.entries(data).map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
    }
    const r = await fetch(API + action, opts);
    return r.json();
}

async function checkEnv() {
    const btn = document.getElementById('btn-check-env');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">&#8635;</span> 检测中...';
    msg('env', '', '');

    try {
        const r = await api('check_environment');
        const list = document.getElementById('env-checks');
        list.innerHTML = r.checks.map(c =>
            '<li>' +
            '<span class="icon ' + (c.passed ? 'pass' : (c.required ? 'fail' : 'warn')) + '">' +
            (c.passed ? '&#10003;' : '&#10007;') + '</span>' +
            '<span>' + c.name + '</span>' +
            (c.passed ? '' : '<span class="hint">' + c.hint + '</span>') +
            '</li>'
        ).join('');
        document.getElementById('env-status').innerHTML = r.all_passed
            ? '<div class="msg msg-success">环境检测通过!</div>'
            : '<div class="msg msg-error">部分必需环境未通过，请修复后重试。</div>';
        if (r.all_passed) document.getElementById('btn-next-1').style.display = '';
    } catch(e) {
        msg('env', '检测失败: ' + e.message, 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '重新检测';
}

async function testDB() {
    const btn = document.getElementById('btn-test-db');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">&#8635;</span> 连接中...';
    msg('db', '', '');
    try {
        const r = await api('test_database', {
            db_host: document.getElementById('db_host').value,
            db_port: document.getElementById('db_port').value,
            db_name: document.getElementById('db_name').value,
            db_user: document.getElementById('db_user').value,
            db_pass: document.getElementById('db_pass').value
        });
        if (r.success) {
            msg('db', '数据库连接成功!', 'success');
            document.getElementById('btn-install-db').style.display = '';
        } else {
            msg('db', r.message, 'error');
        }
    } catch(e) {
        msg('db', '连接失败: ' + e.message, 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '测试连接';
}

async function installDB() {
    const btn = document.getElementById('btn-install-db');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">&#8635;</span> 安装中...';
    msg('db', '', '');
    try {
        const r = await api('install_database');
        if (r.success) {
            msg('db', '数据库安装成功!', 'success');
            document.getElementById('btn-next-2').style.display = '';
        } else {
            msg('db', r.message, 'error');
        }
    } catch(e) {
        msg('db', '安装失败: ' + e.message, 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '安装数据库';
}

async function createAdmin() {
    const pwd = document.getElementById('admin_password').value;
    if (pwd.length < 8) { msg('admin', '密码至少8位', 'error'); return; }
    const btn = document.querySelector('#step3 .btn-primary');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">&#8635;</span> 安装中...';
    msg('admin', '', '');
    try {
        const r = await api('create_admin', {
            admin_username: document.getElementById('admin_username').value,
            admin_email: document.getElementById('admin_email').value,
            admin_fullname: document.getElementById('admin_fullname').value,
            admin_password: pwd,
            registration_mode: document.getElementById('registration_mode').value,
            captcha: document.getElementById('admin_captcha').value
        });
        if (r.success) {
            goStep(4);
        } else {
            msg('admin', r.message, 'error');
            if (r.message && r.message.includes('验证码')) refreshCaptcha();
        }
    } catch(e) {
        msg('admin', '安装失败: ' + e.message, 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '完成安装';
}

function refreshCaptcha() {
    document.getElementById('captcha-img').src = 'Captcha.php?_=' + Date.now();
}

checkEnv();
</script>
</body>
</html>
